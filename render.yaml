services:
  - type: web
    name: drt-key-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python key_bot.py
    healthCheckPath: /healthz
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: KEY_API_HOST
        value: 0.0.0.0
      - key: KEY_API_TRUST_PROXY
        value: "true"
